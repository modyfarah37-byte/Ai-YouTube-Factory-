name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ai_youtube_factory_phone_build.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          mkdir build_source
          unzip -q ai_youtube_factory_phone_build.zip -d build_source

      - name: Build APK
        working-directory: build_source/android_app
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-YouTube-Factory-APK
          path: build_source/android_app/app/build/outputs/apk/debug/app-debug.apk
