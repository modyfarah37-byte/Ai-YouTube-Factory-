name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ai_youtube_factory_phone_build/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          mkdir -p build_source
          unzip -q ai_youtube_factory_phone_build.zip -d build_source

      - name: Build Release APK
        run: |
          PROJECT_DIR=$(dirname "$(find build_source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)")
          echo "Project: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleRelease

      - name: Sign APK
        run: |
          APK=$(find build_source -path "*/build/outputs/apk/release/*.apk" -type f | head -n 1)

          keytool -genkeypair \
            -v \
            -keystore release-key.jks \
            -alias ai-youtube \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=AI YouTube Factory, O=Cairo, C=EG"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks release-key.jks \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app-release.apk \
            "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-YouTube-Factory-Release
          path: app-release.apk
