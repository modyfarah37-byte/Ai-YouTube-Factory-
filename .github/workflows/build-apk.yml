name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ai_youtube_factory_phone_build/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir -p build_source
          unzip -q ai_youtube_factory_phone_build.zip -d build_source
          echo "Project extracted"
          find build_source -name gradlew -type f

      - name: Build and sign APK
        run: |
          ANDROID_DIR=$(dirname "$(find build_source -name gradlew -type f -print -quit)")
          cd "$ANDROID_DIR"

          chmod +x gradlew
          ./gradlew assembleRelease

          APK=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)

          keytool -genkeypair \
            -v \
            -keystore release-key.jks \
            -alias ai-youtube \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=AI YouTube Factory, OU=App, O=AI YouTube Factory, L=Cairo, ST=Giza, C=EG"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks release-key.jks \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app-release.apk \
            "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-YouTube-Factory-Release
          path: '**/app-release.apk'
